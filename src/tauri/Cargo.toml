[package]
name = "money24"
version = "0.1.0"
description = "Money 24 app: news feed and trading desk; Go engines as desktop sidecars"
edition = "2021"
publish = false

[lib]
# Android loads the app as a shared library; desktop links it into the binary.
name = "money24_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: Money 24's icon in the system tray (src/tray.rs).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# Already in the tree through tauri; named here to read the services' status routes for the tray tooltip.
serde_json = "1"

# Desktop only. single-instance: a second launch hands its arguments to the running app and exits, instead of
# a second tray icon and a second set of windows. It is one small crate (no dependencies outside the tree tauri
# already pulls in) and replaces a named mutex plus a window message written by hand for each platform.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

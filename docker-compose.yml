# Money 24 engine services. Same file on Windows (Docker Desktop), Linux and the VPS:
#   docker compose up -d --build
# Ports bind to 127.0.0.1 only. Put a reverse proxy in front before exposing anything.
name: money24

services:
  news:
    build:
      context: ./engine
      args:
        CMD: newsd
    env_file: .env
    environment:
      NEWSD_DATA: /data
      NEWSD_ADDR: 0.0.0.0:8024
      # Only these Host headers are served, so a web page cannot reach the API by DNS rebinding.
      NEWSD_HOSTS: localhost:8024,127.0.0.1:8024
    volumes:
      - news-data:/data
    ports:
      - "127.0.0.1:8024:8024"
    restart: unless-stopped

  trading:
    build:
      context: ./engine
      args:
        CMD: m24d
    env_file: .env
    environment:
      M24D_HOSTS: localhost:8025,127.0.0.1:8025
    command: ["--data", "/data", "--addr", "0.0.0.0:8025"]
    volumes:
      - trading-data:/data
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  news-data:
  trading-data:

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money 24 · News</title>
<style>
  :root {
    --bg: #07080a;          /* page background */
    --panel: #0e1013;       /* header and rows */
    --line: #1c1f24;        /* 1px grid boundaries */
    --text: #e8eaed;        /* headlines */
    --muted: #8a9099;       /* time, source, counters */
    --accent: #3ddc84;      /* live dot, active chip, watchlist tags */
    --warn: #ffb020;        /* filings and central banks */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 var(--font); }
  body { display: grid; grid-template-rows: auto auto 1fr; max-width: 80rem; margin: 0 auto; border-inline: 1px solid var(--line); overflow: hidden; }
  header { display: flex; align-items: center; gap: .75rem; padding: .9rem 1rem; border-bottom: 1px solid var(--line); }
  h1 { font-size: clamp(1rem, 2.5vw, 1.35rem); letter-spacing: .02em; }
  h1 b { color: var(--accent); }
  .live { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); transition: background .15s; }
  .live.on { background: var(--accent); animation: pulse 2s ease-in-out infinite; }
  .stat { margin-left: auto; font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  nav { display: flex; gap: .4rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: 12px var(--mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 99px; padding: .25rem .65rem; cursor: pointer; transition: color .15s, border-color .15s, transform .15s; }
  .chip:hover { transform: translateY(-1px); color: var(--text); }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .chip:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ol { list-style: none; padding: 0; overflow-y: auto; }
  li { display: grid; grid-template-columns: 4.2rem 1fr; gap: .2rem .75rem; padding: .7rem 1rem; border-bottom: 1px solid var(--line); animation: enter .35s cubic-bezier(.2,.9,.3,1.2) both; }
  li.hide { display: none; }
  time { font: 12px var(--mono); color: var(--muted); padding-top: .15rem; }
  a { color: var(--text); text-decoration: none; }
  a:hover { color: var(--accent); }
  .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: .35rem; font: 11px var(--mono); color: var(--muted); }
  .kind-filing, .kind-insider, .kind-central_bank, .kind-macro { color: var(--warn); }
  .tag { color: var(--accent); }
  .empty { padding: 2rem 1rem; color: var(--muted); font: 13px var(--mono); }
  @keyframes enter { from { opacity: 0; transform: translateY(-.5rem); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (min-width: 120rem) { html { font-size: 20px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <span class="live" id="live" aria-hidden="true"></span>
  <h1>Money <b>24</b> · News</h1>
  <span class="stat" id="stat">connecting…</span>
</header>
<nav id="filters" aria-label="Filters">
  <button class="chip on" data-filter="all">All</button>
  <button class="chip" data-filter="watch">Watchlist</button>
</nav>
<ol id="feed" aria-live="polite"><li class="empty">Waiting for the first headline…</li></ol>
<script>
  const MAX_ROWS = 400;
  const feed = document.getElementById('feed');
  const filters = document.getElementById('filters');
  const stat = document.getElementById('stat');
  const live = document.getElementById('live');
  const knownTags = new Set();
  let filter = 'all';
  let total = 0;
  let lastMinute = [];

  const visible = (tags) => filter === 'all' || (filter === 'watch' ? tags.length > 0 : tags.includes(filter));

  function row(e) {
    const li = document.createElement('li');
    const tags = e.tags || [];
    li.dataset.tags = tags.join(' ');
    li.classList.toggle('hide', !visible(tags));
    const t = new Date(e.seen_at);
    const time = document.createElement('time');
    time.dateTime = e.seen_at;
    time.textContent = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const a = document.createElement('a');
    a.href = e.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = e.title;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const parts = [[e.source, ''], [e.kind, 'kind-' + e.kind]];
    if (e.lang && e.lang !== 'English') parts.push([e.lang, '']);
    for (const tag of tags) parts.push(['#' + tag, 'tag']);
    for (const [text, cls] of parts) {
      const s = document.createElement('span');
      s.textContent = text; s.className = cls;
      meta.append(s);
    }
    li.append(time, a, meta);
    for (const tag of tags) addTagChip(tag);
    return li;
  }

  function addTagChip(tag) {
    if (knownTags.has(tag)) return;
    knownTags.add(tag);
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.filter = tag; b.textContent = '#' + tag;
    filters.append(b);
  }

  function add(e, atTop) {
    feed.querySelector('.empty')?.remove();
    const li = row(e);
    atTop ? feed.prepend(li) : feed.append(li);
    while (feed.children.length > MAX_ROWS) feed.lastChild.remove();
    total++;
  }

  function tick() {
    const now = Date.now();
    lastMinute = lastMinute.filter((t) => now - t < 60000);
    stat.textContent = `${total} shown · ${lastMinute.length}/min`;
  }

  filters.addEventListener('click', (ev) => {
    const b = ev.target.closest('.chip');
    if (!b) return;
    filter = b.dataset.filter;
    for (const c of filters.children) c.classList.toggle('on', c === b);
    for (const li of feed.children) li.classList.toggle('hide', !visible((li.dataset.tags || '').split(' ').filter(Boolean)));
  });

  fetch('/api/events?limit=200').then((r) => r.json()).then((events) => { events.forEach((e) => add(e, false)); tick(); });

  const stream = new EventSource('/api/stream');
  stream.onopen = () => live.classList.add('on');
  stream.onerror = () => live.classList.remove('on');
  stream.onmessage = (m) => { add(JSON.parse(m.data), true); lastMinute.push(Date.now()); tick(); };
  setInterval(tick, 5000);
</script>
</body>
</html>
